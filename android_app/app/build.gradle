plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------------
// Load secrets from .env (preferred), falling back to local.properties.
// Neither file is committed — see .env.example for the required keys.
// ---------------------------------------------------------------------------
def envProps = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.withInputStream { envProps.load(it) }
}
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def secret = { String key -> envProps.getProperty(key) ?: localProps.getProperty(key, '') }

android {
    namespace 'com.roadflow.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.roadflow.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Inject secrets as a manifest placeholder + BuildConfig fields
        def mapsKey = secret('MAPS_API_KEY')
        manifestPlaceholders = [MAPS_API_KEY: mapsKey]
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsKey}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${secret('FIREBASE_API_KEY')}\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"${secret('FIREBASE_APP_ID')}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${secret('FIREBASE_PROJECT_ID')}\""
        buildConfigField "String", "FIREBASE_PROJECT_NUMBER", "\"${secret('FIREBASE_PROJECT_NUMBER')}\""
        buildConfigField "String", "FIREBASE_STORAGE_BUCKET", "\"${secret('FIREBASE_STORAGE_BUCKET')}\""
        buildConfigField "String", "FIREBASE_DB_URL", "\"${secret('FIREBASE_DB_URL')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Prevent compression of TFLite model files
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'

    // Google Places SDK (Autocomplete)
    implementation 'com.google.android.libraries.places:places:3.3.0'

    // OkHttp (Directions API calls)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Firebase (BoM manages versions)
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Testing (required by Android Studio even if unused)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
